<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#140820">
  <title>Starstring</title>
  <meta name="description" content="A string between stars. Swing from glowing rings across an alien star system, chasing the pet blob who ran away. A jump, run, and swinging game, designed by AXY.">
  <link rel="canonical" href="https://starstring.y7.ai/">

  <!-- THE ICON.
       The cyan ring you swing from, a string dropping out of it, a gold
       star on the end. Browsers that understand SVG use that one and get
       a sharp icon at any size; the .ico is there for the ones that don't,
       and for Windows shortcuts. -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="32x32">

  <!-- ADDED TO A HOME SCREEN.
       iPhones and iPads read the two lines below; Android reads the
       manifest. Between them, "add to home screen" gives you the icon,
       the name, and a game that opens full screen with no address bar. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Starstring">
  <link rel="manifest" href="site.webmanifest">

  <!-- SENT AS A LINK.
       What WhatsApp, Signal, Slack, Discord, iMessage and the rest show
       instead of a bare address. The picture has to be a full web address,
       not a relative one, because it is fetched from somebody else's
       computer that knows nothing about this folder. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Starstring">
  <meta property="og:title" content="Starstring — a string between stars">
  <meta property="og:description" content="Swing from glowing rings across an alien star system, chasing the pet blob who ran away. A jump, run, and swinging game, designed by AXY.">
  <meta property="og:url" content="https://starstring.y7.ai/">
  <meta property="og:image" content="https://starstring.y7.ai/assets/og.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A glowing cyan ring with a string hanging from it and a gold star on the end, and the glowing blob you spend the game chasing.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="stage">
    <canvas id="game"></canvas>
  </div>

  <!-- Order matters: each file uses the ones above it -->
  <script src="js/config.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/input.js"></script>
  <script src="js/level.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/background.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/title.js"></script>
  <script src="js/planet.js"></script>
  <script src="js/planetdraw.js"></script>
  <script src="js/grapple.js"></script>
  <script src="js/monsters.js"></script>
  <script src="js/player.js"></script>
  <script src="js/game.js"></script>

</body>
</html>
